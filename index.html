<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Enlaces | Nuestro Trabajo</title>
    
    <!-- Tipografía Inter de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #0f172a, #172554);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-container {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            font-size: 28px;
            color: white;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
        }

        .greeting {
            font-size: 1.05rem;
            font-weight: 300;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 35px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px 20px;
            text-decoration: none;
            color: #f1f5f9;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .link-card:hover::before {
            transform: translateX(100%);
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.3);
        }

        .link-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 16px;
            color: #60a5fa;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .link-card:hover .link-icon {
            background: #3b82f6;
            color: white;
        }

        .link-text {
            flex-grow: 1;
            text-align: left;
            letter-spacing: 0.2px;
        }

        .link-arrow {
            color: #64748b;
            font-size: 0.9rem;
            transition: transform 0.3s ease;
        }

        .link-card:hover .link-arrow {
            transform: translateX(4px);
            color: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        
        <!-- Icono principal de cabecera -->
        <div class="header-icon">
            <i class="fa-solid fa-network-wired"></i>
        </div>

        <p class="greeting">
            Gracias por conectar con nosotros. Para saber más sobre nuestro trabajo, ingresa a los siguientes enlaces:
        </p>
        
        <nav class="links-wrapper">
            
            <a href="https://sputniklab.xyz/" class="link-card" target="_blank" rel="noopener noreferrer">
                <div class="link-icon"><i class="fa-solid fa-code"></i></div>
                <span class="link-text">Sitio web Daniel Rivera</span>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>
            
            <a href="https://www.em0r3n0dev.xyz/" class="link-card" target="_blank" rel="noopener noreferrer">
                <div class="link-icon"><i class="fa-solid fa-terminal"></i></div>
                <span class="link-text">Sitio web Emiliano Moreno</span>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>
            
            <a href="https://os.upiita.ipn.mx/" class="link-card" target="_blank" rel="noopener noreferrer">
                <div class="link-icon"><i class="fa-brands fa-osi"></i></div>
                <span class="link-text">Open Source UPIITA</span>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

        </nav>
    </div>

</body>
</html>
